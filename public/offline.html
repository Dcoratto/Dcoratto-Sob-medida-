<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8C6A48" />
    <title>D'Coratto offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fbfbfd;
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
      }

      img {
        display: block;
        width: 180px;
        max-width: 70%;
        height: auto;
        margin-bottom: 28px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.15;
        font-weight: 600;
      }

      p {
        margin: 12px 0 0;
        color: #64748b;
        font-size: 15px;
        line-height: 1.55;
      }

      button {
        margin-top: 24px;
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 16px;
        background: #8c6a48;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="D'Coratto" />
      <h1>Voce esta sem conexao</h1>
      <p>Alguns dados podem nao estar disponiveis. Assim que a internet voltar, recarregue para buscar as informacoes atuais do D'Coratto.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
